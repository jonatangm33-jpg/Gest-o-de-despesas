<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda & Calculadora Financeira</title>
  
  <!-- Estilos Monocromáticos de Alto Contraste -->
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #ffffff;
      --danger-bg: #3c1e1e;
      --danger-border: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #21262d;
      color: var(--text-main);
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      background-color: var(--text-main);
      color: var(--bg-color);
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-pdf {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .resumo-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .resumo-item.total {
      border-bottom: none;
      font-weight: bold;
      font-size: 18px;
      margin-top: 5px;
      padding-top: 10px;
      border-top: 2px solid var(--text-main);
    }

    .item-lista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .item-detalhes {
      display: flex;
      flex-direction: column;
    }

    .item-nome {
      font-weight: bold;
    }

    .item-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-del {
      width: auto;
      padding: 5px 10px;
      background-color: var(--danger-bg);
      color: var(--danger-border);
      border: 1px solid var(--danger-border);
      margin: 0;
    }

    .alerta-box {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #ff7b72;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
  </style>

  <!-- Biblioteca jsPDF para exportação de Relatório PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <h1>Agenda Financeira</h1>

  <!-- Alerta Sonoro / Push em Tela -->
  <div id="alertaVencimento" class="alerta-box">
    ⚠️ <strong>Atenção ao Vencimento!</strong><br>
    <span id="alertaTexto"></span>
  </div>

  <!-- Painel de Cálculos / Resumo -->
  <div class="card">
    <h2>Resumo do Mês</h2>
    <div class="resumo-item">
      <span>Receita Total (Casal)</span>
      <span id="txtReceita">0,00 €</span>
    </div>
    <div class="resumo-item">
      <span>Benefícios / ISS Abono</span>
      <span id="txtBeneficios">0,00 €</span>
    </div>
    <div class="resumo-item">
      <span>Despesas Fixas</span>
      <span id="txtFixas">0,00 €</span>
    </div>
    <div class="resumo-item">
      <span>Despesas Variáveis</span>
      <span id="txtVariaveis">0,00 €</span>
    </div>
    <div class="resumo-item total">
      <span>Saldo Restante</span>
      <span id="txtSaldo">0,00 €</span>
    </div>

    <button onclick="gerarPDF()" class="btn-pdf">📄 Gerar Relatório Mensal (PDF)</button>
  </div>

  <!-- Formulário de Adição -->
  <div class="card">
    <h2>Novo Lançamento</h2>
    <input type="text" id="descricao" placeholder="Descrição (ex: Internet, Abono ISS, Salário)">
    
    <div class="grid-2">
      <div>
        <label>Valor (€)</label>
        <input type="number" id="valor" step="0.01" placeholder="0.00">
      </div>
      <div>
        <label>Data Vencimento</label>
        <input type="date" id="dataVencimento">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Categoria</label>
        <select id="categoria">
          <option value="fixa">Despesa Fixa</option>
          <option value="variavel">Despesa Variável</option>
          <option value="receita">Receita (Meu / Esposa)</option>
          <option value="beneficio">Benefício / ISS Abono</option>
        </select>
      </div>
      <div>
        <label>Responsável</label>
        <select id="responsavel">
          <option value="Jonatan">Jonatan</option>
          <option value="Esposa">Esposa</option>
          <option value="Ambos">Ambos / Casa</option>
        </select>
      </div>
    </div>

    <button id="btnAdicionar">Adicionar Lançamento</button>
  </div>

  <!-- Lista de Lançamentos -->
  <div class="card">
    <h2>Agenda & Registos</h2>
    <div id="listaItens">Carregando dados sincronizados...</div>
  </div>

  <!-- Conexão Firebase via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Configuração do Firebase com suas chaves
    const firebaseConfig = {
      apiKey: "AIzaSyCUcL1h5Xs9f3KZ0DE14Rk-t8O-WPSu2ek",
      authDomain: "agenda-financeira-e5672.firebaseapp.com",
      projectId: "agenda-financeira-e5672",
      storageBucket: "agenda-financeira-e5672.firebasestorage.app",
      messagingSenderId: "902120998673",
      appId: "1:902120998673:web:92b8c2913b2b6fa51a2eb0",
      databaseURL: "https://agenda-financeira-e5672-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dadosRef = ref(db, 'financas');

    let dadosAtuais = [];

    // Tocar Som de Alerta (usando Beep Web Audio API)
    function tocarAlertaSonoro() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Som em tom de alerta
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {
        console.log("Áudio bloqueado pelo navegador até o primeiro clique.");
      }
    }

    // Escuta em tempo real (Sincronização entre você e sua esposa)
    onValue(dadosRef, (snapshot) => {
      const data = snapshot.val();
      dadosAtuais = [];

      if (data) {
        dadosAtuais = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        }));
      }

      renderizarAplicativo(dadosAtuais);
    });

    // Função de Adicionar
    document.getElementById('btnAdicionar').addEventListener('click', () => {
      const desc = document.getElementById('descricao').value;
      const val = parseFloat(document.getElementById('valor').value);
      const data = document.getElementById('dataVencimento').value;
      const cat = document.getElementById('categoria').value;
      const resp = document.getElementById('responsavel').value;

      if (!desc || isNaN(val)) {
        alert("Por favor, preencha a descrição e o valor.");
        return;
      }

      push(dadosRef, {
        descricao: desc,
        valor: val,
        data: data || new Date().toISOString().split('T')[0],
        categoria: cat,
        responsavel: resp
      });

      // Limpar campos
      document.getElementById('descricao').value = '';
      document.getElementById('valor').value = '';
    });

    // Função de Apagar
    window.removerItem = (id) => {
      remove(ref(db, 'financas/' + id));
    };

    // Renderizar Tela & Calcular Totais
    function renderizarAplicativo(lista) {
      let totReceita = 0;
      let totBeneficio = 0;
      let totFixas = 0;
      let totVariaveis = 0;

      const container = document.getElementById('listaItens');
      container.innerHTML = '';

      const hojeStr = new Date().toISOString().split('T')[0];
      let alertas = [];

      lista.forEach(item => {
        // Somatório
        if (item.categoria === 'receita') totReceita += item.valor;
        if (item.categoria === 'beneficio') totBeneficio += item.valor;
        if (item.categoria === 'fixa') totFixas += item.valor;
        if (item.categoria === 'variavel') totVariaveis += item.valor;

        // Verificar Vencimento Proximo ou Hoje (Alerta)
        if ((item.categoria === 'fixa' || item.categoria === 'variavel') && item.data) {
          const diffDias = Math.ceil((new Date(item.data) - new Date(hojeStr)) / (1000 * 60 * 60 * 24));
          if (diffDias >= 0 && diffDias <= 1) {
            alertas.push(`${item.descricao} (${item.valor.toFixed(2)} €) - Vence ${diffDias === 0 ? 'HOJE' : 'AMANHÃ'}`);
          }
        }

        // Criar elemento HTML na Lista
        const div = document.createElement('div');
        div.className = 'item-lista';
        div.innerHTML = `
          <div class="item-detalhes">
            <span class="item-nome">${item.descricao} (${item.responsavel})</span>
            <span class="item-sub">${item.categoria.toUpperCase()} | Vencimento: ${item.data}</span>
          </div>
          <div>
            <strong style="margin-right: 10px;">${item.valor.toFixed(2)} €</strong>
            <button class="btn-del" onclick="removerItem('${item.id}')">X</button>
          </div>
        `;
        container.appendChild(div);
      });

      // Atualizar Painel Financeiro
      document.getElementById('txtReceita').innerText = totReceita.toFixed(2) + ' €';
      document.getElementById('txtBeneficios').innerText = totBeneficio.toFixed(2) + ' €';
      document.getElementById('txtFixas').innerText = totFixas.toFixed(2) + ' €';
      document.getElementById('txtVariaveis').innerText = totVariaveis.toFixed(2) + ' €';

      const saldo = (totReceita + totBeneficio) - (totFixas + totVariaveis);
      const txtSaldo = document.getElementById('txtSaldo');
      txtSaldo.innerText = saldo.toFixed(2) + ' €';
      txtSaldo.style.color = saldo >= 0 ? '#3fb950' : '#f85149';

      // Exibir Alertas na Tela e Som
      const boxAlerta = document.getElementById('alertaVencimento');
      if (alertas.length > 0) {
        boxAlerta.style.display = 'block';
        document.getElementById('alertaTexto').innerHTML = alertas.join('<br>');
        tocarAlertaSonoro();
      } else {
        boxAlerta.style.display = 'none';
      }
    }

    // Função de Exportar PDF
    window.gerarPDF = () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Relatório Financeiro Mensal", 20, 20);

      doc.setFontSize(12);
      doc.text(`Receita Total: ${document.getElementById('txtReceita').innerText}`, 20, 35);
      doc.text(`Benefícios / ISS: ${document.getElementById('txtBeneficios').innerText}`, 20, 43);
      doc.text(`Despesas Fixas: ${document.getElementById('txtFixas').innerText}`, 20, 51);
      doc.text(`Despesas Variáveis: ${document.getElementById('txtVariaveis').innerText}`, 20, 59);
      doc.text(`Saldo Final: ${document.getElementById('txtSaldo').innerText}`, 20, 69);

      doc.text("Detalhamento:", 20, 85);
      let y = 95;

      dadosAtuais.forEach(item => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(`${item.data} - ${item.descricao} (${item.responsavel}): ${item.valor.toFixed(2)} EUR`, 20, y);
        y += 8;
      });

      doc.save("Relatorio_Financeiro.pdf");
    };
  </script>
</body>
</html>
