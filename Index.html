header{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;color:#fff;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:24px;font-weight:800}header p{font-size:13px;opacity:.8;margin-top:2px}
#dot{width:10px;height:10px;border-radius:50%;background:var(--rd);box-shadow:0 0 0 3px #fff3}#dot.on{background:#4ade80}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
.card{background:#fffffff2;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px #0005}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px}
.bal{background:linear-gradient(135deg,#4f6bf0,#6d3df0);color:#fff}
.bal small{opacity:.85;font-size:13px}.bal .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.bal .r{display:flex;gap:16px;font-size:13px}.bal .r b{display:block;font-size:15px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-size:16px;text-transform:capitalize}
.mnav button{background:var(--bg);color:var(--tx);width:34px;height:34px;border-radius:50%;padding:0;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;font-size:11px;color:var(--mu);padding:4px 0}
.cal button{background:none;color:var(--tx);height:38px;padding:0;border-radius:50%;font-size:14px;font-weight:500;position:relative}
.cal button.sel{background:var(--pu);color:#fff;font-weight:700}.cal button.td{outline:2px solid var(--or);outline-offset:-2px}
.cal button u{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px;text-decoration:none}
.cal button u s{width:5px;height:5px;border-radius:50%;background:var(--or)}.cal button u s.i{background:var(--gr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tot{border-radius:18px;padding:14px;color:#fff}.tot small{font-size:12px;opacity:.9}.tot div{font-size:19px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.day{font-size:13px;font-weight:700;color:var(--mu);margin:12px 0 6px}
.it{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.it.paid{opacity:.55}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.it .n{font-weight:600;font-size:14px}.it .m{font-size:12px;color:var(--mu);margin-top:2px}.it .v{margin-left:auto;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.it .a{display:flex;gap:6px;margin-top:5px;justify-content:flex-end}
button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--pu);color:#fff;cursor:pointer}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button.g{background:var(--bg);color:var(--tx)}button.d{background:var(--bg);color:var(--rd)}button.s{padding:5px 10px;font-size:12px}.blk{width:100%;margin-top:8px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #dcd9ea;background:#fff;color:var(--tx);font:inherit;font-size:16px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px 2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;background:#15131f;border-radius:26px;display:flex;align-items:center;padding:8px 6px;z-index:20}
nav button{flex:1;background:none;color:#8d8aa3;font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px}nav button.active{color:var(--or)}
nav .plus{flex:0 0 58px;height:58px;border-radius:50%;background:var(--pu);color:#fff;font-size:28px;margin-top:-30px;padding:0;box-shadow:0 0 0 6px #15131f;display:grid;place-items:center}
#sheet{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end}
#sheet.on{display:flex}#sheet>div{background:#fff;width:100%;max-width:640px;margin:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.seg button{background:var(--bg);color:var(--tx)}.seg button.on{background:var(--pu);color:#fff}
svg.ch{width:100%;height:auto;display:block}
.leg{display:grid;gap:8px;margin-top:12px}.leg div{display:flex;align-items:center;gap:8px;font-size:13px}.leg i{width:12px;height:12px;border-radius:4px}.leg span{flex:1}
.gauge{text-align:center}.gauge svg{width:100%;max-width:250px}.gauge .lv{font-size:20px;font-weight:800;margin-top:-32px}.gauge .sc{font-size:12px;color:var(--mu)}
.al{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:13px;line-height:1.35;border-left:4px solid var(--mu);text-align:left}
.al.hi{border-color:var(--rd)}.al.md{border-color:var(--yl)}.al.lo{border-color:var(--gr)}
.empty{text-align:center;color:var(--mu);padding:20px 8px;font-size:14px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:100;display:grid;gap:8px;pointer-events:none}
.toast{background:#fff;border-left:5px solid var(--or);padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px #0006}
</style>
</head>
<body>
<div id="toasts"></div>
<header><div><h1 id="hi">Olá</h1><p id="today"></p></div><span id="dot"></span></header>
<main>
<section id="v-home" class="view active">
  <div class="card bal"><small>Saldo do mês</small><div class="big" id="h-bal"></div><div class="r"><div>Entradas<b id="h-in"></b></div><div>Despesas<b id="h-out"></b></div><div>Por pagar<b id="h-pend"></b></div></div></div>
  <div class="card"><div class="mnav"><button onclick="mv(-1)" aria-label="Mês anterior">‹</button><b id="mlabel"></b><button onclick="mv(1)" aria-label="Mês seguinte">›</button></div><div class="cal" id="cal"></div></div>
  <div class="two"><div class="tot" style="background:var(--pu)"><small>Total entradas</small><div id="t-in"></div></div><div class="tot" style="background:var(--or)"><small>Total despesas</small><div id="t-out"></div></div></div>
  <div class="card"><h2 id="seltitle">Movimentos do dia</h2><div id="sel-list"></div></div>
  <div class="card"><h2>Despesas por categoria</h2><svg id="donut" class="ch" viewBox="0 0 200 200" style="max-width:230px;margin:auto"></svg><div class="leg" id="leg"></div></div>
</section>

<section id="v-mov" class="view">
  <div class="card"><div class="mnav"><button onclick="mv(-1)" aria-label="Mês anterior">‹</button><b class="ml"></b><button onclick="mv(1)" aria-label="Mês seguinte">›</button></div>
    <button class="blk g" onclick="copyPrev()">Copiar despesas do mês anterior</button></div>
  <div class="card"><h2>Movimentos do mês</h2><div id="mlist"></div></div>
</section>

<section id="v-an" class="view">
  <div class="card gauge"><h2>Nível de risco</h2>
    <svg viewBox="0 0 200 110"><path d="M10 100A90 90 0 0 1 190 100" fill="none" stroke="#eceaf5" stroke-width="16" stroke-linecap="round"/><path id="g-arc" d="M10 100A90 90 0 0 1 190 100" fill="none" stroke="#2faa6b" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 283"/></svg>
    <div class="lv" id="g-lv"></div><div class="sc" id="g-sc"></div><div id="alerts"></div></div>
  <div class="card"><h2>Evolução do saldo no mês</h2><svg id="flow" class="ch" viewBox="0 0 320 150"></svg><div id="flow-note" style="color:var(--mu);font-size:12px;margin-top:8px"></div></div>
  <div class="card"><h2>Entradas vs saídas</h2><svg id="bars" class="ch" viewBox="0 0 320 170"></svg></div>
</section>

<section id="v-more" class="view">
  <div class="card"><h2>Relatório</h2><button class="blk" onclick="pdf()">Gerar PDF do mês</button></div>
  <div class="card"><h2>Casa partilhada</h2><label>Código da casa (igual nos dois telemóveis)</label><input id="code" placeholder="Ex.: familia-mendes-7k2x">
    <button class="blk g" onclick="saveCode()">Guardar código e recarregar</button><p style="color:var(--mu);font-size:12px;margin-top:8px">Vazio = dados antigos (appState).</p></div>
  <div class="card"><h2>Alertas</h2><button class="blk g" onclick="notif()">Ativar notificações</button><button class="blk d" onclick="reset()">Apagar todos os dados</button></div>
</section>
</main>

<div id="sheet" onclick="if(event.target===this)closeS()"><div>
  <div class="seg"><button id="k-d" class="on" onclick="setK('d')">Despesa</button><button id="k-i" onclick="setK('i')">Entrada</button></div>
  <input type="hidden" id="f-k"><input type="hidden" id="f-kind" value="d">
  <label id="l-n">Nome</label><input id="f-n" placeholder="Ex.: Renda">
  <div class="f2"><div><label>Valor (€)</label><input id="f-v" type="number" step="0.01" inputmode="decimal"></div><div><label>Data</label><input id="f-d" type="date"></div></div>
  <div id="w-c"><label>Categoria</label><select id="f-c"></select></div>
  <button class="blk" onclick="saveF()">Guardar</button><button class="blk g" onclick="closeS()">Cancelar</button>
</div></div>

<nav>
  <button class="active" onclick="sw('home',this)"><i>⌂</i>Início</button>
  <button onclick="sw('mov',this)"><i>☰</i>Movimentos</button>
  <button class="plus" onclick="openS()" aria-label="Adicionar">+</button>
  <button onclick="sw('an',this)"><i>◔</i>Análise</button>
  <button onclick="sw('more',this)"><i>⚙</i>Mais</button>
</nav>

const fmt=v=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"}).format(v||0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const iso=d=>mk(d)+"-"+String(d.getDate()).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=s=>s.split("-").reverse().join("/");
const toast=(m,t=4000)=>{const e=document.createElement("div");e.className="toast";e.textContent=m;$("toasts").appendChild(e);setTimeout(()=>e.remove(),t)};
const list=x=>!x?[]:(Array.isArray(x)?x.map((v,i)=>v&&{...v,_k:String(i)}):Object.entries(x).map(([k,v])=>({...v,_k:k}))).filter(Boolean);
const put=(kind,it)=>{const {_k,...c}=it;return set(ref(db,`${base}/${kind}/${_k||it.id}`),c).catch(()=>toast("Sem ligação — não sincronizado"))};
const del=(kind,k)=>remove(ref(db,`${base}/${kind}/${k}`));
const CAT={Renda:["🏠","#e8e4ff"],Crédito:["🏦","#e3ecff"],Luz:["💡","#fff3d6"],Água:["💧","#dff3ff"],Internet:["📶","#e3ecff"],Telemóvel:["📱","#e8e4ff"],Seguros:["🛡️","#e2f6ea"],Transportes:["🚗","#ffe9df"],Saúde:["💊","#ffe3e5"],Alimentação:["🛒","#ffe9df"],Lazer:["🎬","#f3e2fb"],Outros:["📦","#eceaf5"],Entrada:["💶","#e2f6ea"]};
$("f-c").innerHTML=Object.keys(CAT).filter(k=>k!=="Entrada").map(k=>`<option>${k}</option>`).join("");
const PAL=["#6d3df0","#ee7b4d","#2faa6b","#4f8df0","#c05ce0","#e0a526","#9a98ae"];

onValue(ref(db,".info/connected"),s=>$("dot").classList.toggle("on",!!s.val()));
onValue(ref(db,base),s=>{
  const v=s.val()||{};D=list(v.despesas);B=list(v.beneficios);
  const now=new Date();
  D.forEach(d=>{if(!d.data){ // migração: despesas antigas passam a pertencer ao mês atual
    const dia=Math.min(d.diaVencimento||1,new Date(now.getFullYear(),now.getMonth()+1,0).getDate());
    d.data=mk(now)+"-"+String(dia).padStart(2,"0");d.pago=!!(d.pago||(d.pagos&&d.pagos[mk(now)]));delete d.pagos;delete d.diaVencimento;put("despesas",d)}});
  render();if(first){first=false;alerts()}});

const mes=()=>mk(cur),N=()=>new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
const Dm=()=>D.filter(d=>d.data.startsWith(mes())),Bm=()=>B.filter(b=>b.data&&b.data.startsWith(mes()));
const dn=s=>+s.slice(8,10);
function totals(){const inc=Bm().reduce((s,b)=>s+b.valor,0),dm=Dm(),out=dm.reduce((s,d)=>s+d.valor,0),pd=dm.filter(d=>d.pago).reduce((s,d)=>s+d.valor,0),cats={};dm.forEach(d=>cats[d.categoria]=(cats[d.categoria]||0)+d.valor);return{inc,out,pd,pend:out-pd,bal:inc-out,cats}}
function flow(){const a=[];let b=0;for(let i=1;i<=N();i++){b+=Bm().filter(x=>dn(x.data)===i).reduce((s,x)=>s+x.valor,0)-Dm().filter(x=>dn(x.data)===i).reduce((s,x)=>s+x.valor,0);a.push(b)}return a}
function risk(){
  const t=totals(),f=flow(),min=Math.min(...f),md=f.indexOf(min)+1,F=[];let sc=0;
  if(t.inc===0&&t.out>0){sc=100;F.push(["hi","Sem entradas neste mês, mas há despesas."])}
  else if(t.out>0){
    const r=t.out/t.inc;sc+=Math.round(Math.max(0,Math.min(1,(r-.5)/.5))*50);F.push([r>=1?"hi":r>=.8?"md":"lo",`As despesas ocupam ${(r*100).toFixed(0)}% das entradas.`]);
    const top=Object.entries(t.cats).sort((a,b)=>b[1]-a[1])[0],sh=top[1]/t.out;sc+=Math.round(Math.max(0,Math.min(1,(sh-.35)/.4))*15);
    if(sh>.5)F.push(["md",`${top[0]} pesa ${(sh*100).toFixed(0)}% das despesas.`]);
    if(min<0){sc+=25;F.push(["hi",`O saldo fica negativo a partir do dia ${md} (mínimo ${fmt(min)}).`])}else if(min<t.inc*.1){sc+=12;F.push(["md",`Saldo mínimo de ${fmt(min)} no dia ${md} — margem curta.`])}
    const n=new Date(),lim=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()+7)),soon=D.filter(d=>!d.pago&&d.data>=iso(n)&&d.data<=lim).reduce((s,d)=>s+d.valor,0);
    if(soon>t.inc*.4&&soon>0){sc+=10;F.push(["md",`${fmt(soon)} vencem nos próximos 7 dias.`])}
    if(t.bal>=t.inc*.2)F.push(["lo",`Sobram ${(t.bal/t.inc*100).toFixed(0)}% das entradas.`])}
  sc=Math.min(100,sc);return{sc,F,min,md,lv:sc<30?["Baixo","#2faa6b"]:sc<60?["Médio","#e0a526"]:["Alto","#e5484d"]}}

function item(x,kind){
  const inc=kind==="i",c=CAT[inc?"Entrada":x.categoria]||CAT.Outros,k=x._k;
  return `<div class="it ${!inc&&x.pago?"paid":""}"><div class="ic" style="background:${c[1]}">${c[0]}</div><div><div class="n">${esc(inc?x.tipo:x.nome)}</div><div class="m">${inc?"Entrada":esc(x.categoria)} · ${fd(x.data)}</div></div><div class="v"><span style="color:${inc?"var(--gr)":"var(--tx)"}">${inc?"+":"−"}${fmt(x.valor)}</span><div class="a">${inc?"":`<button class="s g" onclick="tp('${k}')">${x.pago?"Pago ✓":"Pagar"}</button>`}<button class="s g" onclick="ed('${kind}','${k}')" aria-label="Editar">✎</button><button class="s d" onclick="rm('${kind}','${k}')" aria-label="Apagar">✕</button></div></div></div>`}
const moves=f=>[...Dm().filter(f).map(x=>[x,"d"]),...Bm().filter(f).map(x=>[x,"i"])].sort((a,b)=>b[0].data.localeCompare(a[0].data));

function render(){
  const h=new Date().getHours();$("hi").textContent=(h<12?"Bom dia":h<20?"Boa tarde":"Boa noite")+" 👋";
  $("today").textContent=new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"});
  const ml=cur.toLocaleDateString("pt-PT",{month:"long",year:"numeric"});$("mlabel").textContent=ml;document.querySelectorAll(".ml").forEach(e=>e.textContent=ml);
  const t=totals(),r=risk();
  $("h-bal").textContent=fmt(t.bal);$("h-in").textContent=fmt(t.inc);$("h-out").textContent=fmt(t.out);$("h-pend").textContent=fmt(t.pend);$("t-in").textContent=fmt(t.inc);$("t-out").textContent=fmt(t.out);
  drawCal();
  const sl=sel&&sel.startsWith(mes())?moves(x=>x.data===sel):[];
  $("seltitle").textContent=sel&&sel.startsWith(mes())?"Dia "+fd(sel):"Toque num dia do calendário";
  $("sel-list").innerHTML=sl.length?sl.map(m=>item(...m)).join(""):'<div class="empty">Sem movimentos neste dia.</div>';
  const all=moves(()=>true);let html="",last="";
  all.forEach(m=>{if(m[0].data!==last){last=m[0].data;html+=`<div class="day">${new Date(last+"T12:00").toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"short"})}</div>`}html+=item(...m)});
  $("mlist").innerHTML=html||'<div class="empty">Sem movimentos. Toque em + para lançar.</div>';
  const g=$("g-arc");g.setAttribute("stroke",r.lv[1]);g.setAttribute("stroke-dasharray",`${r.sc/100*283} 283`);$("g-lv").textContent=r.lv[0];$("g-lv").style.color=r.lv[1];$("g-sc").textContent=`Pontuação ${r.sc}/100`;
  $("alerts").innerHTML=r.F.map(a=>`<div class="al ${a[0]}">${esc(a[1])}</div>`).join("");
  drawFlow(r);drawCharts(t);
}
function drawCal(){
  const off=(new Date(cur.getFullYear(),cur.getMonth(),1).getDay()+6)%7,td=iso(new Date());
  let s="STQQSSD".split("").map(l=>`<i>${l}</i>`).join("")+"<span></span>".repeat(off);
  for(let i=1;i<=N();i++){const ds=mes()+"-"+String(i).padStart(2,"0"),e=D.some(x=>x.data===ds),n=B.some(x=>x.data===ds);
    s+=`<button class="${ds===sel?"sel":""} ${ds===td?"td":""}" onclick="pick('${ds}')">${i}${e||n?`<u>${e?"<s></s>":""}${n?'<s class="i"></s>':""}</u>`:""}</button>`}
  $("cal").innerHTML=s}
function drawFlow(r){
  const f=flow(),n=f.length,W=320,H=150,p=14,hi=Math.max(...f,0),lo=Math.min(...f,0),rg=(hi-lo)||1,X=i=>p+i*(W-2*p)/(n-1),Y=v=>p+(hi-v)/rg*(H-2*p),pts=f.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`),z=Y(0);
  $("flow").innerHTML=`<line x1="${p}" x2="${W-p}" y1="${z}" y2="${z}" stroke="#cfcbe0" stroke-dasharray="4 4"/><polygon points="${X(0)},${z} ${pts.join(" ")} ${X(n-1)},${z}" fill="${r.min<0?"#e5484d":"#6d3df0"}" fill-opacity=".14"/><polyline points="${pts.join(" ")}" fill="none" stroke="#6d3df0" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(r.md-1)}" cy="${Y(r.min)}" r="5" fill="${r.min<0?"#e5484d":"#ee7b4d"}"/>`;
  $("flow-note").textContent=`Ponto mais baixo: ${fmt(r.min)} no dia ${r.md}.`}
function drawCharts(t){
  const c=Object.entries(t.cats).sort((a,b)=>b[1]-a[1]);
  if(!t.out){$("donut").innerHTML='<text x="100" y="104" text-anchor="middle" fill="#7b7890" font-size="12">Sem despesas</text>';$("leg").innerHTML=""}
  else{const R=70,C=2*Math.PI*R;let o=0,s="";c.forEach(([k,v],i)=>{const d=v/t.out*C;s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${PAL[i%7]}" stroke-width="26" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-o}" transform="rotate(-90 100 100)"/>`;o+=d});
    $("donut").innerHTML=s+`<text x="100" y="106" text-anchor="middle" fill="#1d1b2e" font-size="15" font-weight="800">${fmt(t.out)}</text>`;
    $("leg").innerHTML=c.map(([k,v],i)=>`<div><i style="background:${PAL[i%7]}"></i><span>${esc(k)} · ${(v/t.out*100).toFixed(0)}%</span><b>${fmt(v)}</b></div>`).join("")}
  const mx=Math.max(t.inc,t.out,Math.abs(t.bal),1),d=[["Entradas",t.inc,"#2faa6b"],["Saídas",t.out,"#ee7b4d"],["Saldo",t.bal,t.bal>=0?"#6d3df0":"#e5484d"]];
  $("bars").innerHTML=d.map((x,i)=>{const h=Math.abs(x[1])/mx*110,px=30+i*100;return `<rect x="${px}" y="${130-h}" width="60" height="${h}" rx="8" fill="${x[2]}"/><text x="${px+30}" y="${122-h}" text-anchor="middle" fill="#1d1b2e" font-size="11" font-weight="700">${fmt(x[1])}</text><text x="${px+30}" y="150" text-anchor="middle" fill="#7b7890" font-size="11">${x[0]}</text>`}).join("")}

window.sw=(n,b)=>{document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$("v-"+n).classList.add("active");document.querySelectorAll("nav button:not(.plus)").forEach(x=>x.classList.remove("active"));b.classList.add("active");scrollTo(0,0)};
window.mv=n=>{cur.setMonth(cur.getMonth()+n);sel=null;render()};
window.pick=d=>{sel=d;render()};
window.setK=k=>{$("f-kind").value=k;$("k-d").classList.toggle("on",k==="d");$("k-i").classList.toggle("on",k==="i");$("w-c").style.display=k==="d"?"":"none";$("l-n").textContent=k==="d"?"Nome":"Descrição (ex.: Salário)"};
window.openS=()=>{clr();$("f-d").value=sel||(mes()===mk(new Date())?iso(new Date()):mes()+"-01");$("sheet").classList.add("on")};
window.closeS=()=>$("sheet").classList.remove("on");
function clr(){["f-k","f-n","f-v"].forEach(i=>$(i).value="");setK("d");$("k-d").disabled=$("k-i").disabled=false}
window.ed=(kind,k)=>{const x=(kind==="d"?D:B).find(y=>y._k===k);if(!x)return;clr();setK(kind);$("k-d").disabled=$("k-i").disabled=true;$("f-k").value=k;$("f-n").value=kind==="d"?x.nome:x.tipo;$("f-v").value=x.valor;$("f-d").value=x.data;if(kind==="d")$("f-c").value=x.categoria;$("sheet").classList.add("on")};
window.saveF=()=>{
  const kind=$("f-kind").value,k=$("f-k").value,n=$("f-n").value.trim(),v=parseFloat($("f-v").value),d=$("f-d").value;
  if(!n)return toast("Indique o nome");if(!(v>0))return toast("Valor inválido");if(!d)return toast("Indique a data");
  const old=(kind==="d"?D:B).find(y=>y._k===k)||{};
  if(kind==="d")put("despesas",{...old,id:old.id||uid(),_k:k||undefined,nome:n,valor:v,data:d,categoria:$("f-c").value,pago:!!old.pago});
  else put("beneficios",{...old,id:old.id||uid(),_k:k||undefined,tipo:n,valor:v,data:d});
  const dt=new Date(d+"T12:00");cur=new Date(dt.getFullYear(),dt.getMonth(),1);sel=d;closeS();toast("Guardado")};
window.rm=(kind,k)=>{if(confirm("Apagar apenas este lançamento?"))del(kind==="d"?"despesas":"beneficios",k)};
window.tp=k=>{const x=D.find(y=>y._k===k);if(x)put("despesas",{...x,pago:!x.pago})};
window.copyPrev=()=>{
  const p=new Date(cur.getFullYear(),cur.getMonth()-1,1),pm=mk(p),src=D.filter(d=>d.data.startsWith(pm));
  if(!src.length)return toast("O mês anterior não tem despesas");
  if(Dm().length&&!confirm("Este mês já tem despesas. Copiar mesmo assim?"))return;
  src.forEach(d=>{const dia=Math.min(dn(d.data),N());put("despesas",{id:uid(),nome:d.nome,valor:d.valor,categoria:d.categoria,data:mes()+"-"+String(dia).padStart(2,"0"),pago:false})});
  toast(src.length+" despesas copiadas")};
window.saveCode=()=>{try{localStorage.setItem("fpt-code",$("code").value.trim().toLowerCase().replace(/[^a-z0-9-]/g,""))}catch(e){}location.reload()};
window.notif=()=>{if(!("Notification" in window))return toast("Não suportado");Notification.requestPermission().then(p=>toast(p==="granted"?"Notificações ativas":"Não autorizado"))};
window.reset=()=>{if(prompt("Escreva APAGAR para eliminar todos os dados partilhados:")==="APAGAR")remove(ref(db,base)).then(()=>toast("Dados apagados"))};
function alerts(){const n=new Date(),a=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)),b=iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()+3));
  D.filter(d=>!d.pago&&(d.data===a||d.data===b)).forEach(d=>{const m=`${d.nome} vence ${d.data===a?"amanhã":"em 3 dias"} — ${fmt(d.valor)}`;toast("⚠ "+m,7000);try{if(Notification.permission==="granted")new Notification("Vencimento próximo",{body:m})}catch(e){}})}
window.pdf=()=>{
  if(!window.jspdf)return toast("PDF indisponível sem internet");
  const doc=new window.jspdf.jsPDF(),t=totals(),r=risk();let y=20;
  const ln=(a,b,bo)=>{if(y>275){doc.addPage();y=20}doc.setFont("helvetica",bo?"bold":"normal");doc.text(a,14,y);if(b)doc.text(b,196,y,{align:"right"});y+=6};
  doc.setFontSize(18);doc.setFont("helvetica","bold");doc.text("Relatorio Financeiro",14,y);y+=8;doc.setFontSize(10);
  ln("Periodo: "+$("mlabel").textContent);ln("Nivel de risco: "+r.lv[0]+" ("+r.sc+"/100)");y+=4;
  ln("Despesas",fmt(t.out),1);Dm().sort((a,b)=>a.data.localeCompare(b.data)).forEach(d=>ln(`${fd(d.data)} ${d.nome} (${d.categoria}) ${d.pago?"[pago]":"[pendente]"}`,fmt(d.valor)));y+=4;
  ln("Entradas",fmt(t.inc),1);Bm().forEach(b=>ln(`${fd(b.data)} ${b.tipo}`,fmt(b.valor)));y+=4;ln("Saldo do mes",fmt(t.bal),1);
  try{/iPad|iPhone|iPod/.test(navigator.userAgent)?window.open(doc.output("bloburl"),"_blank"):doc.save("relatorio-"+mes()+".pdf")}catch(e){toast("Nao foi possivel gerar o PDF")}};
$("code").value=code;
</script>
</body>
</html>
